spring.application.name=movierecommendation

# PostgreSQL - dùng Railway's built-in vars
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Server
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
# Retry connecting until DB is ready (Railway race condition fix)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# API Keys
openai.api.key=${openai.api.key:}
tmdb.api.key=${tmdb.api.key:}
app.remember-me-key=${app.remember-me-key:movieRecProdKey2024}

# Provider-neutral OpenAI-compatible chat model (OpenAI by default).
# Point AI_BASE_URL at Ollama/LM Studio and set AI_CHAT_MODEL to switch provider.
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
ai.chat-model=${AI_CHAT_MODEL:gpt-4o-mini}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:8}

# Logging
logging.level.com.example.movierecommendation=INFO

# Mail Configuration (Brevo SMTP)
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${APP_MAIL_FROM:noreply@movierec.local}
app.verification.code-expiration-minutes=10
app.verification.code-length=6

# Cache-busting static resources
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
