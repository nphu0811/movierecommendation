spring.application.name=movierecommendation

# PostgreSQL - Railway may provide either SPRING_DATASOURCE_URL or PG* reference vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Versioned database migrations. Existing databases are baselined at the last
# legacy migration (v6), then Flyway applies migrations from db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
# Retry connecting until DB is ready (Railway race condition fix)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# API Keys
openai.api.key=${OPENAI_API_KEY:}
tmdb.api.key=${TMDB_API_KEY:}
app.remember-me-key=${REMEMBER_ME_KEY:${app.remember-me-key:}}

# Provider-neutral OpenAI-compatible chat model (OpenAI by default).
# Point AI_BASE_URL at Ollama/LM Studio and set AI_CHAT_MODEL to switch provider.
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
ai.chat-model=${AI_CHAT_MODEL:gpt-4o-mini}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:8}

# Logging
logging.level.com.example.movierecommendation=INFO

# Mail Configuration (Brevo SMTP)
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${APP_MAIL_FROM:noreply@movierec.local}
app.verification.code-expiration-minutes=10
app.verification.code-length=6
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
app.demo.password=${DEMO_PASSWORD:}

# Cache-busting static resources
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
