<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="#{auth.loginTitle} + ' - MovieRec'">Login - MovieRec</title>
  <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=2)}"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
<div class="auth-container auth-container--login">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg-glow auth-bg-glow--primary"></div>
    <div class="auth-bg-glow auth-bg-glow--secondary"></div>
    <canvas class="auth-particles-canvas" id="authParticlesCanvas"></canvas>
  </div>

  <div class="auth-shell">
    <aside class="auth-showcase" aria-hidden="true">
      <div class="auth-kicker">
        <i class="ph-fill ph-sparkle"></i>
        <span th:text="#{auth.showcaseLoginKicker}">Personal cinema</span>
      </div>
      <h1 th:text="#{auth.showcaseLoginTitle}">Find the next movie that actually fits your taste.</h1>
      <p th:text="#{auth.showcaseLoginDesc}">Sign in to continue recommendations, watch history, and your saved list without losing context.</p>
      <div class="auth-feature-list">
        <div class="auth-feature-card">
          <i class="ph-fill ph-brain"></i>
          <span th:text="#{auth.showcaseFeaturePicks}">Smarter picks</span>
        </div>
        <div class="auth-feature-card">
          <i class="ph-fill ph-clock-counter-clockwise"></i>
          <span th:text="#{auth.showcaseFeatureHistory}">Resume history</span>
        </div>
        <div class="auth-feature-card">
          <i class="ph-fill ph-heart"></i>
          <span th:text="#{auth.showcaseFeatureWatchlist}">Saved watchlist</span>
        </div>
      </div>
    </aside>

    <div class="auth-card auth-card--login">
      <div class="auth-logo">
        <div class="auth-logo-mark">Movie<span>Rec</span></div>
        <p th:text="#{auth.loginTitle}">Sign in to your account</p>
      </div>

      <a href="/" class="btn btn-outline" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:var(--space-4);text-decoration:none;font-size:0.9rem">
        <i class="ph-bold ph-house"></i> <span th:text="#{auth.backToHome}">Back to Home</span>
      </a>

      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
      <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

      <form th:action="@{/auth/login}" method="post" class="auth-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
          <label class="form-label" for="email" th:text="#{auth.emailLabel}">Email Address</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@example.com" required autofocus autocomplete="email"/>
        </div>

        <div class="form-group">
          <label class="form-label auth-label-row" for="password">
            <span th:text="#{auth.passwordLabel}">Password</span>
            <a href="/auth/forgot-password" class="auth-link" th:text="#{auth.forgotPasswordLink}">Forgot password?</a>
          </label>
          <div class="password-field">
            <input type="password" id="password" name="password" class="form-control"
                   th:placeholder="#{auth.passwordLabel}" required autocomplete="current-password"/>
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
              <i class="ph-bold ph-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="auth-remember">
          <input type="checkbox" name="remember-me" id="remember"/>
          <label for="remember" th:text="#{auth.rememberMe}">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" th:text="#{auth.signInBtn}">
          Sign In
        </button>
      </form>

      <div class="auth-alt-action">
        <span th:text="#{auth.noAccount}">Don't have an account?</span>
        <a href="/auth/register" th:text="#{auth.registerLink}">Sign up free</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
