<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="#{auth.resetPasswordTitle} + ' - MovieRec'">Reset Password - MovieRec</title>
  <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=2)}"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">
<div class="auth-container auth-container--forgot">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg-glow auth-bg-glow--primary"></div>
    <div class="auth-bg-glow auth-bg-glow--secondary"></div>
    <canvas class="auth-particles-canvas" id="authParticlesCanvas"></canvas>
  </div>

  <div class="auth-shell">
    <aside class="auth-showcase" aria-hidden="true">
      <div class="auth-kicker">
        <i class="ph-fill ph-keyhole"></i>
        <span th:text="#{auth.showcaseRecoveryKicker}">Account recovery</span>
      </div>
      <h1 th:text="#{auth.showcaseRecoveryTitle}">Get back to your movie queue without starting over.</h1>
      <p th:text="#{auth.resetPasswordSub}">Enter your new password below to reset your password.</p>
      <div class="auth-feature-list">
        <div class="auth-feature-card">
          <i class="ph-fill ph-lock-key"></i>
          <span th:text="#{auth.showcaseFeatureRecoveryReset}">Secure reset</span>
        </div>
      </div>
    </aside>

    <div class="auth-card auth-card--forgot">
      <div class="auth-logo">
        <div class="auth-logo-mark"><span th:text="#{auth.resetPasswordTitle}">Reset Password</span></div>
        <p th:text="#{auth.resetPasswordSub}">Enter your new password below.</p>
      </div>

      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <form th:action="@{/auth/reset-password}" method="post" class="auth-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="email" th:value="${email}"/>
        <input type="hidden" name="code" th:value="${code}"/>

        <div class="form-group">
          <label class="form-label" for="newPassword" th:text="#{auth.passwordLabel}">New Password</label>
          <div class="password-field">
            <input type="password" id="newPassword" name="newPassword" class="form-control"
                   minlength="6" th:placeholder="#{auth.newPasswordPlaceholder}" required autocomplete="new-password"/>
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
              <i class="ph-bold ph-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword" th:text="#{auth.confirmPasswordLabel}">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                   minlength="6" th:placeholder="#{auth.repeatNewPasswordPlaceholder}" required autocomplete="new-password"/>
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
              <i class="ph-bold ph-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" th:text="#{auth.resetPasswordTitle}">Reset Password</button>
      </form>

      <div class="auth-alt-action">
        <a href="/auth/login" th:text="#{auth.backToLogin}">Back to sign in</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
