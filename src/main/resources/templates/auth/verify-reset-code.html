<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="#{auth.verifyResetCodeTitle} + ' - MovieRec'">Verify Reset Code - MovieRec</title>
  <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=2)}"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    /* Premium style details for Verify Email page */
    .verify-code-input-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 1.5rem 0;
    }
    .verify-code-input {
      width: 50px;
      height: 58px;
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--white);
      outline: none;
      transition: all 0.3s var(--ease);
    }
    .verify-code-input:focus {
      background: rgba(229, 9, 20, 0.05);
      border-color: var(--red);
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
      transform: translateY(-2px);
    }
    .resend-container {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .resend-btn {
      background: none;
      border: none;
      color: var(--red);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-left: 5px;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .resend-btn:hover {
      color: #ff4d4d;
    }
    .resend-btn:disabled {
      color: var(--text-muted);
      cursor: not-allowed;
      text-decoration: none;
    }
  </style>
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg-glow auth-bg-glow--primary"></div>
    <div class="auth-bg-glow auth-bg-glow--secondary"></div>
    <canvas class="auth-particles-canvas" id="authParticlesCanvas"></canvas>
  </div>

  <div class="auth-shell">
    <aside class="auth-showcase" aria-hidden="true">
      <div class="auth-kicker">
        <i class="ph-fill ph-shield-check"></i>
        <span th:text="#{auth.showcaseRecoveryKicker}">Account recovery</span>
      </div>
      <h1 th:text="#{auth.showcaseRecoveryTitle}">Get back to your movie queue without starting over.</h1>
      <p th:text="#{auth.verifyResetCodeDesc}">Enter the 6-digit code sent to your email to verify your identity.</p>
      <div class="auth-feature-list">
        <div class="auth-feature-card">
          <i class="ph-fill ph-lock-key"></i>
          <span th:text="#{auth.showcaseFeatureRecoveryReset}">Secure reset</span>
        </div>
        <div class="auth-feature-card">
          <i class="ph-fill ph-film-reel"></i>
          <span th:text="#{auth.showcaseFeatureRecoveryLists}">Keep your lists</span>
        </div>
      </div>
    </aside>

    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-mark">Movie<span>Rec</span></div>
        <p th:text="#{auth.verifyResetCodeTitle}">Verify Reset Code</p>
      </div>

      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

      <form th:action="@{/auth/forgot-password/verify}" method="post" class="auth-form" id="verifyForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="email" th:value="${email}"/>

        <div class="form-group">
          <label class="form-label" style="text-align: center; display: block;" th:text="#{auth.verificationCodeLabel}">Verification Code</label>
          
          <!-- Modern 6-digit split input -->
          <div class="verify-code-input-container" id="otpContainer">
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
            <input type="text" maxlength="1" class="verify-code-input" required autocomplete="off" />
          </div>
          
          <input type="hidden" name="code" id="finalCode" />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" th:text="#{auth.verifyEmailBtn}">
          Verify & Continue
        </button>
      </form>

      <div class="resend-container">
        <span th:text="#{auth.hasAccount}">Didn't receive code?</span>
        <button id="resendBtn" class="resend-btn" onclick="resendCode()" th:text="#{auth.resendCode}">Resend Code</button>
        <span id="countdown"></span>
      </div>

      <div class="auth-alt-action" style="margin-top: 2rem;">
        <a href="/auth/login" th:text="#{auth.backToLogin}">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('#otpContainer .verify-code-input');
    const form = document.getElementById('verifyForm');
    const finalCodeInput = document.getElementById('finalCode');

    // Auto focus transitions
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value.length > 0 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        updateFinalCode();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      
      // Paste support
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const data = e.clipboardData.getData('text').trim();
        if (data.length === 6 && /^\d+$/.test(data)) {
          for (let i = 0; i < 6; i++) {
            inputs[i].value = data[i];
          }
          inputs[5].focus();
          updateFinalCode();
        }
      });
    });

    function updateFinalCode() {
      let code = '';
      inputs.forEach(input => code += input.value);
      finalCodeInput.value = code;
    }

    form.addEventListener('submit', (e) => {
      updateFinalCode();
      if (finalCodeInput.value.length !== 6) {
        e.preventDefault();
        alert(/*[[${#locale.language == 'vi' ? 'Vui lòng điền đủ 6 chữ số' : 'Please enter all 6 digits'}]]*/ 'Please enter all 6 digits');
      }
    });

    // Countdown logic for resend button
    let cooldown = 60;
    const resendBtn = document.getElementById('resendBtn');
    const countdownSpan = document.getElementById('countdown');

    function startTimer() {
      resendBtn.disabled = true;
      let interval = setInterval(() => {
        cooldown--;
        if (cooldown <= 0) {
          clearInterval(interval);
          resendBtn.disabled = false;
          countdownSpan.innerText = '';
          cooldown = 60;
        } else {
          const text = /*[[${#locale.language == 'vi' ? 'Gửi lại sau ({0}s)' : 'Resend in ({0}s)'}]]*/ 'Resend in ({0}s)';
          countdownSpan.innerText = text.replace('{0}', cooldown);
        }
      }, 1000);
    }

    // Expose resend logic to global scope
    window.resendCode = function() {
      const email = /*[[${email}]]*/ '';
      const token = document.querySelector('input[name="_csrf"]').value;

      resendBtn.disabled = true;
      
      fetch('/auth/forgot-password/resend', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRF-TOKEN': token
        },
        body: 'email=' + encodeURIComponent(email)
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert(/*[[${#locale.language == 'vi' ? 'Đã gửi lại mã xác minh mới!' : 'New verification code sent!'}]]*/ 'New verification code sent!');
          startTimer();
        } else {
          alert(data.message || 'Error');
          resendBtn.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        alert('Server error');
        resendBtn.disabled = false;
      });
    };

    // Auto trigger timer on load if needed
    startTimer();
  });
  /*]]>*/
</script>
</body>
</html>
