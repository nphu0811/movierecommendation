<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Browse all movies – filter by genre, sort by rating or year."/>
  <title>Movies – MovieRec</title>
  <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=2)}"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <style>
    .list-filters {
      background: var(--bg-elevated);
      padding: var(--space-4);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      height: fit-content;
      position: sticky;
      top: 6rem;
    }
    .filter-form h3 {
      font-size: 1.1rem;
      margin-bottom: var(--space-4);
      color: var(--white);
      border-bottom: 1px solid var(--border);
      padding-bottom: var(--space-2);
      font-family: var(--font-display);
    }
    .filter-group {
      margin-bottom: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .filter-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filter-group input, .filter-group select {
      background: var(--black);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--white);
      padding: var(--space-2) var(--space-3);
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--t-fast) var(--ease);
      font-family: var(--font);
    }
    .filter-group input:focus, .filter-group select:focus {
      border-color: var(--red);
    }
    .filter-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
      margin-top: var(--space-5);
    }
    .filter-actions button, .filter-actions a {
      text-align: center;
      padding: var(--space-2);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-fast) var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .filter-actions .btn-primary {
      background: var(--red);
      color: var(--white);
      border: none;
    }
    .filter-actions .btn-primary:hover {
      background: var(--red-hover);
    }
    .filter-actions .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .filter-actions .btn-secondary:hover {
      border-color: var(--border-hover);
      color: var(--white);
    }
  </style>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: mobileNav(${activeMenu})}"></div>
<div th:replace="~{search-overlay :: searchOverlay}"></div>

<div class="list-layout">

  <!-- ── FILTER SIDEBAR ── -->
  <aside class="list-filters">
    <form method="get" action="/movies" class="filter-form">
      <h3><i class="ph-fill ph-funnel" style="margin-right:8px;vertical-align:-2px;color:var(--text-secondary)"></i> Bộ lọc nâng cao</h3>
      
      <div class="filter-group">
        <label>Tìm kiếm</label>
        <input type="text" name="q" th:value="${q}" placeholder="Từ khóa...">
      </div>
      
      <div class="filter-group">
        <label>Thể loại</label>
        <select name="genreId">
          <option value="">Tất cả thể loại</option>
          <option th:each="genre : ${allGenres}" 
                  th:value="${genre.genreId}" 
                  th:text="${genre.genreName}" 
                  th:selected="${genre.genreId == genreId}"></option>
        </select>
      </div>

      <div class="filter-group">
        <label>Năm phát hành</label>
        <input type="number" name="year" th:value="${year}" placeholder="Ví dụ: 2024" min="1900" max="2100">
      </div>

      <div class="filter-group">
        <label>Đánh giá tối thiểu</label>
        <input type="number" step="0.1" name="minRating" th:value="${minRating}" placeholder="Ví dụ: 4.0" min="0" max="5">
      </div>

      <div class="filter-group">
        <label>Sắp xếp theo</label>
        <select name="sortBy">
          <option value="newest" th:selected="${sortBy == 'newest'}">Mới nhất</option>
          <option value="top_rated" th:selected="${sortBy == 'top_rated'}">Đánh giá cao nhất</option>
          <option value="most_watched" th:selected="${sortBy == 'most_watched'}">Xem nhiều nhất</option>
          <option value="title_az" th:selected="${sortBy == 'title_az'}">Tên phim A-Z</option>
          <option value="release_year" th:selected="${sortBy == 'release_year'}">Năm phát hành</option>
        </select>
      </div>

      <div class="filter-actions">
        <button type="submit" class="btn-primary">Áp dụng</button>
        <a href="/movies" class="btn-secondary">Xóa bộ lọc</a>
      </div>
    </form>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <div>
    <div class="list-header">
      <h1 class="section-title" style="font-size:1.5rem;font-weight:800"><i class="ph-fill ph-film-strip" style="margin-right:8px;vertical-align:-3px;color:var(--text-secondary)"></i> All <span>Movies</span></h1>
      <span style="color:#606060;font-size:.875rem;font-weight:500"
            th:text="${moviePage.totalElements} + ' titles'">0 titles</span>
    </div>

    <!-- Skeleton placeholders -->
    <div class="movies-grid" id="skeleton-grid" style="display:none">
      <div th:each="i : ${#numbers.sequence(1,10)}" class="skeleton-card">
        <div class="skeleton-poster"></div>
        <div class="skeleton-info">
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-line--short"></div>
        </div>
      </div>
    </div>

    <!-- Real grid -->
    <div class="movies-grid" th:if="${!moviePage.content.empty}" id="movies-grid">
      <th:block th:each="movie : ${moviePage.content}">
        <div th:replace="~{fragments :: movieCard(${movie})}"></div>
      </th:block>
    </div>

    <div class="empty-state" th:if="${moviePage.content.empty}">
      <div class="icon"><i class="ph-fill ph-film-strip"></i></div>
      <h3>No movies yet</h3>
      <p>Try a different genre or come back later.</p>
    </div>

    <!-- Pagination -->
    <div th:if="${moviePage.totalPages > 1}" id="pagination-container"
         th:attr="data-current=${moviePage.number}, data-total=${moviePage.totalPages}">
    </div>
  </div>

</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/pagination.js}"></script>
<script>
initPagination('pagination-container', '/movies');
</script>
</body>
</html>
