<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Watch History – MovieRec</title>
  <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=2)}"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: mobileNav(${activeMenu})}"></div>
<div th:replace="~{search-overlay :: searchOverlay}"></div>
<div class="section">
  <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
    <h1 class="section-title"><i class="ph-fill ph-clock-counter-clockwise" style="margin-right:8px;vertical-align:-3px;color:var(--text-secondary)"></i> Watch <span>History</span></h1>
    <div style="display:flex; align-items:center; gap:15px;">
      <span style="color:#6c757d;font-size:.875rem"
            th:text="|${#lists.size(watchHistory)} movie(s) watched|">0 movies</span>
      <button th:if="${!#lists.isEmpty(watchHistory)}" type="button" class="btn btn-secondary btn-sm" onclick="clearWatchHistory()" style="color: var(--red); border-color: rgba(229, 9, 20, 0.2)">
        <i class="ph-bold ph-trash"></i> Xóa tất cả
      </button>
    </div>
  </div>

  <div th:if="${!#lists.isEmpty(watchHistory)}">
    <div th:each="wh : ${watchHistory}" th:id="'history-row-' + ${wh.historyId}"
         style="display:flex;align-items:center;gap:1rem;padding:1rem;
                background:#1f1f1f;border-radius:10px;margin-bottom:.75rem;
                transition:background .2s"
         onmouseover="this.style.background='#2a2a2a'"
         onmouseout="this.style.background='#1f1f1f'">
      <img th:if="${wh.movie.posterUrl != null and !#strings.isEmpty(wh.movie.posterUrl)}"
           th:src="${wh.movie.posterUrl}" th:alt="${wh.movie.title}"
           style="width:50px;height:75px;border-radius:6px;object-fit:cover;flex-shrink:0"
           onerror="this.style.display='none'"/>
      <div th:unless="${wh.movie.posterUrl != null and !#strings.isEmpty(wh.movie.posterUrl)}"
           style="width:50px;height:75px;border-radius:6px;background:#333;
                  display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ph-fill ph-film-strip"></i></div>
      <div style="flex:1">
        <a th:href="@{/movies/{id}(id=${wh.movie.movieId})}"
           style="font-weight:600;font-size:.95rem" th:text="${wh.movie.title}">Title</a>
        <div style="display:flex;gap:1rem;margin-top:.3rem;flex-wrap:wrap">
          <span style="color:#6c757d;font-size:.8rem" th:text="${wh.movie.releaseYear}">2024</span>
          <span style="font-size:.8rem;color:#6c757d">
            <i class="ph ph-calendar" style="vertical-align:-1px"></i> <span th:text="${#temporals.format(wh.watchedAt, 'MMM dd, yyyy')}">Date</span>
          </span>
          <span style="font-size:.8rem;color:#6c757d">
            <i class="ph ph-clock" style="vertical-align:-1px"></i> <span th:text="${wh.getFormattedDuration()}">0s</span>
          </span>
        </div>
        <div style="width:120px;height:4px;background:#333;border-radius:2px;margin-top:.6rem" th:if="${wh.progress != null and wh.progress > 0}">
          <div style="height:100%;background:var(--primary);border-radius:2px;box-shadow:0 0 8px var(--primary-glow)" th:style="'width:' + ${wh.progress} + '%'"></div>
        </div>
        <div class="genre-tags" style="margin-top:.5rem">
          <span class="genre-tag" th:each="g : ${wh.movie.genres}" th:text="${g.genreName}">Genre</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:8px">
        <a th:href="@{/movies/{id}(id=${wh.movie.movieId})}" class="btn btn-outline btn-sm">View →</a>
        <button type="button" class="btn btn-secondary btn-sm" th:onclick="'deleteWatchHistory(' + ${wh.historyId} + ')'" style="padding: 8px; color: var(--red); border-color: rgba(229, 9, 20, 0.2)">
          <i class="ph-bold ph-trash"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(watchHistory)}">
    <div class="icon"><i class="ph-fill ph-film-strip"></i></div>
    <h3>No watch history yet</h3>
    <p style="margin-bottom:1.5rem">Movies you start watching will appear here.</p>
    <a href="/movies" class="btn btn-primary">Browse Movies</a>
  </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
/*<![CDATA[*/
async function deleteWatchHistory(id) {
  if (!confirm('Bạn có chắc chắn muốn xóa bộ phim này khỏi lịch sử xem?')) return;
  try {
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    const res = await fetch(`/user/api/watch-history/${id}`, {
      method: 'DELETE',
      headers: {
        [csrfHeader]: csrfToken
      }
    });
    if (res.ok) {
      const el = document.getElementById(`history-row-${id}`);
      if (el) el.remove();
      showToast('Xóa thành công!', 'success');
      window.location.reload();
    } else {
      showToast('Không thể xóa lịch sử xem', 'error');
    }
  } catch (e) {
    showToast('Lỗi kết nối server', 'error');
  }
}

async function clearWatchHistory() {
  if (!confirm('Bạn có chắc chắn muốn xóa TOÀN BỘ lịch sử xem phim?')) return;
  try {
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    const res = await fetch('/user/api/watch-history/clear', {
      method: 'DELETE',
      headers: {
        [csrfHeader]: csrfToken
      }
    });
    if (res.ok) {
      showToast('Đã xóa toàn bộ lịch sử xem!', 'success');
      window.location.reload();
    } else {
      showToast('Lỗi khi xóa lịch sử', 'error');
    }
  } catch (e) {
    showToast('Lỗi kết nối server', 'error');
  }
}
/*]]>*/
</script>
</body>
</html>
